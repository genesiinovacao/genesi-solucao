<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Relatórios — SOLUÇÃO</title>
<link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/sidebar.css"><link rel="stylesheet" href="css/components.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-content" id="main-content">
    <header class="top-bar">
      <div class="top-bar-left">
        <button class="toggle-sidebar" id="toggle-sidebar">☰</button>
        <div><div class="page-title">📊 Relatórios</div><div class="page-subtitle" id="empresa-nome">SOLUÇÃO</div></div>
      </div>
      <div class="top-bar-right">
        <button class="notif-btn">🔔<span class="notif-badge" id="notif-badge">0</span></button>
        <div class="user-avatar">JS</div>
      </div>
    </header>
    <div class="page-wrapper">
      <div class="page-header">
        <h1><span class="h1-icon">📊</span>Relatórios</h1>
        <div class="page-actions">
          <div style="display:flex;gap:6px">
            <button class="report-period-btn active" onclick="setPeriodo(7,this)">7 dias</button>
            <button class="report-period-btn" onclick="setPeriodo(15,this)">15 dias</button>
            <button class="report-period-btn" onclick="setPeriodo(30,this)">30 dias</button>
          </div>
          <button class="btn btn-secondary" onclick="exportarRelatorio()">📥 Exportar PDF</button>
        </div>
      </div>

      <div class="kpi-grid" id="rel-kpis"></div>

      <div class="grid-2" style="margin-bottom:18px">
        <div class="card">
          <div class="card-header"><div class="card-title">📈 Vendas no Período</div></div>
          <div class="chart-container"><canvas id="chart-rel-vendas"></canvas></div>
        </div>
        <div class="card">
          <div class="card-header"><div class="card-title">📦 Top 5 Produtos Mais Vendidos</div></div>
          <div class="chart-container"><canvas id="chart-top-produtos"></canvas></div>
        </div>
      </div>

      <div class="grid-2" style="margin-bottom:18px">
        <div class="card">
          <div class="card-header"><div class="card-title">👥 Top Clientes</div></div>
          <div id="top-clientes-list"></div>
        </div>
        <div class="card">
          <div class="card-header"><div class="card-title">🏷️ Desempenho por Categoria</div></div>
          <div id="cat-performance"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><div class="card-title">📋 Histórico de Vendas Detalhado</div></div>
        <div class="table-wrapper">
          <table class="data-table">
            <thead><tr><th>Data</th><th>Vendas</th><th>Faturamento</th><th>Ticket Médio</th><th>Vs. Anterior</th></tr></thead>
            <tbody id="rel-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/data.js"></script><script src="js/app.js"></script><script src="js/relatorios.js"></script>
</body>
</html>
