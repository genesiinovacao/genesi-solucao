# Gera o instalador do PDV e publica como Release no GitHub.
# Os PDVs instalados verificam essa release e se atualizam sozinhos
# (electron-updater lê o latest.yml publicado junto com o .exe).
#
# Como lançar uma versão nova:
#   1. Aumente "version" em solucao-2026/pdv/package.json (ex.: 1.1.0 -> 1.1.1)
#   2. Commit + push
#   3. Aba Actions -> "Release do PDV" -> Run workflow
#      (ou crie uma tag v1.1.1 e dê push nela)
name: Release do PDV

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write   # necessário para criar a release e subir os artefatos

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: solucao-2026/pdv
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: solucao-2026/pdv/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar instalador (sem publicar — a release é o passo seguinte)
        run: |
          npm run build
          npx electron-builder --win --publish never

      - name: Definir tag da release (v + versão do package.json)
        id: tag
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $tag = "${{ github.ref_name }}" }
          else { $tag = "v" + (Get-Content package.json | ConvertFrom-Json).version }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "Release: $tag"

      - name: Publicar release com os artefatos do auto-update
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: SOLUCAO PDV ${{ steps.tag.outputs.tag }}
          files: |
            solucao-2026/pdv/release/SOLUCAO-PDV-Setup-*.exe
            solucao-2026/pdv/release/SOLUCAO-PDV-Setup-*.exe.blockmap
            solucao-2026/pdv/release/latest.yml
