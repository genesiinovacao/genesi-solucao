<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SOLUÇÃO — Login</title>
<meta name="description" content="Sistema SOLUÇÃO de Gestão de Varejo. Faça login para acessar.">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/components.css">
<style>
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg-primary);position:relative;overflow:hidden}
.login-bg{position:absolute;inset:0}
.orb{position:absolute;border-radius:50%;filter:blur(80px);animation:pulse 4s infinite}
.orb1{width:500px;height:500px;background:rgba(124,58,237,.12);top:-150px;left:-150px}
.orb2{width:400px;height:400px;background:rgba(6,182,212,.08);bottom:-100px;right:-100px;animation-delay:2s}
.orb3{width:300px;height:300px;background:rgba(16,185,129,.06);top:50%;left:50%;transform:translate(-50%,-50%);animation-delay:1s}
.login-card{background:rgba(26,29,46,.92);backdrop-filter:blur(24px);border:1px solid var(--border-color);border-radius:var(--radius-xl);padding:44px 40px;width:100%;max-width:430px;position:relative;z-index:10;box-shadow:0 20px 70px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.04)}
.login-logo{text-align:center;margin-bottom:36px}
.login-logo-icon{width:72px;height:72px;border-radius:20px;background:var(--gradient-primary);display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 14px;box-shadow:0 8px 30px rgba(124,58,237,.5),inset 0 1px 0 rgba(255,255,255,.2)}
.login-name{font-size:2.4rem;font-weight:900;background:var(--gradient-primary);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-.03em}
.login-tagline{font-size:.8rem;color:var(--text-muted);margin-top:4px}
.login-title{font-size:1rem;font-weight:600;color:var(--text-secondary);margin-bottom:28px;text-align:center}
.divider-text{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--text-muted);font-size:.75rem}
.divider-text::before,.divider-text::after{content:'';flex:1;height:1px;background:var(--border-color)}
.demo-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(124,58,237,.1);border:1px solid rgba(124,58,237,.2);color:var(--accent-primary);padding:8px 14px;border-radius:var(--radius-md);font-size:.78rem;font-weight:500;margin-top:12px;width:100%;justify-content:center;cursor:pointer;transition:var(--transition)}
.demo-badge:hover{background:rgba(124,58,237,.2)}
.login-footer{text-align:center;margin-top:28px;font-size:.72rem;color:var(--text-muted)}
.features-strip{display:flex;justify-content:center;gap:20px;margin-top:20px;flex-wrap:wrap}
.feature-item{display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--text-muted)}
.feature-item span:first-child{font-size:.85rem}
.input-pwd{position:relative}
.input-pwd input{padding-right:44px}
.pwd-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:.875rem;padding:4px}
</style>
</head>
<body>
<div class="login-page">
  <div class="login-bg">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
  </div>
  <div class="login-card animate-in">
    <div class="login-logo">
      <div class="login-logo-icon">💡</div>
      <div class="login-name">SOLUÇÃO</div>
      <div class="login-tagline">Sistema Completo de Gestão de Varejo</div>
    </div>
    <p class="login-title">Acesse sua conta para continuar</p>
    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="email">E-mail</label>
        <div class="input-group">
          <span class="input-icon">✉️</span>
          <input type="email" id="email" class="form-control" placeholder="seu@email.com" value="admin@solucao.com">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="senha">Senha</label>
        <div class="input-pwd">
          <input type="password" id="senha" class="form-control" placeholder="••••••••" value="123456">
          <button type="button" class="pwd-toggle" id="pwd-toggle">👁️</button>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
        <label style="display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--text-secondary);cursor:pointer">
          <input type="checkbox" checked style="accent-color:var(--accent-primary)"> Lembrar acesso
        </label>
        <a href="#" style="font-size:.78rem;color:var(--accent-primary);text-decoration:none">Esqueceu a senha?</a>
      </div>
      <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center" id="btn-login">
        🚀 Entrar no Sistema
      </button>
    </form>
    <div class="divider-text">ou</div>
    <button class="demo-badge" id="btn-demo">⚡ Acesso Demonstração Rápida</button>
    <div class="features-strip">
      <div class="feature-item"><span>🔒</span><span>Seguro</span></div>
      <div class="feature-item"><span>⚡</span><span>Rápido</span></div>
      <div class="feature-item"><span>📱</span><span>Responsivo</span></div>
      <div class="feature-item"><span>🤖</span><span>IA Integrada</span></div>
    </div>
    <div class="login-footer">© 2026 SOLUÇÃO — Sistema de Gestão de Varejo<br>Todos os direitos reservados</div>
  </div>
</div>
<script src="js/data.js"></script>
<script>
document.getElementById('login-form').addEventListener('submit',function(e){
  e.preventDefault();
  const btn=document.getElementById('btn-login');
  btn.innerHTML='⏳ Entrando...';btn.disabled=true;
  setTimeout(()=>{window.location.href='dashboard.html'},1200);
});
document.getElementById('btn-demo').addEventListener('click',function(){
  this.innerHTML='⏳ Carregando demo...';this.disabled=true;
  setTimeout(()=>{window.location.href='dashboard.html'},800);
});
document.getElementById('pwd-toggle').addEventListener('click',function(){
  const i=document.getElementById('senha');
  i.type=i.type==='password'?'text':'password';
  this.textContent=i.type==='password'?'👁️':'🙈';
});
</script>
</body>
</html>
