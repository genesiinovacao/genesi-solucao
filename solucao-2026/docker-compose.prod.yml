# ============================================================================
# SOLUÇÃO 2026 — produção (banco + backend na mesma VPS)
#
#   1. Copie .env.example para .env e preencha os segredos
#   2. docker compose -f docker-compose.prod.yml up -d --build
#   3. Após a PRIMEIRA subida, troque a senha do role da aplicação:
#      docker exec -it solucao-postgres psql -U solucao_admin -d solucao \
#        -c "ALTER ROLE solucao_app PASSWORD '<mesma senha do POSTGRES_APP_PASSWORD>'"
#   4. Coloque um reverse proxy com HTTPS na frente (Caddy/Nginx/Traefik)
#      apontando para localhost:5160 — não exponha o backend sem TLS.
#
# O Postgres NÃO publica porta no host: só o backend fala com ele pela
# rede interna do compose. pgAdmin não sobe em produção.
# ============================================================================
services:
  postgres:
    image: postgres:16-alpine
    container_name: solucao-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: solucao
      POSTGRES_USER: solucao_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?defina no .env}
    volumes:
      - solucao_pgdata:/var/lib/postgresql/data
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/02_roles.sql:/docker-entrypoint-initdb.d/02_roles.sql:ro
      - ./database/04_functions.sql:/docker-entrypoint-initdb.d/04_functions.sql:ro
      - ./database/05_tenant_columns.sql:/docker-entrypoint-initdb.d/05_tenant_columns.sql:ro
      - ./database/06_cash_session_link.sql:/docker-entrypoint-initdb.d/06_cash_session_link.sql:ro
      - ./database/07_sale_returns.sql:/docker-entrypoint-initdb.d/07_sale_returns.sql:ro
      - ./database/08_fiscal_documents.sql:/docker-entrypoint-initdb.d/08_fiscal_documents.sql:ro
      - ./database/09_tenant_registration.sql:/docker-entrypoint-initdb.d/09_tenant_registration.sql:ro
      - ./database/10_platform_admin.sql:/docker-entrypoint-initdb.d/10_platform_admin.sql:ro
      # 03_seed.sql (tenants demo) fica de fora em produção de propósito
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solucao_admin -d solucao"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: solucao-backend
    restart: unless-stopped
    environment:
      ConnectionStrings__AppDb: "Host=postgres;Port=5432;Database=solucao;Username=solucao_app;Password=${POSTGRES_APP_PASSWORD:?defina no .env};Pooling=true;Minimum Pool Size=1;Maximum Pool Size=20"
      Jwt__Key: ${JWT_KEY:?defina no .env}
      Cors__AllowedOrigins__0: ${DASHBOARD_ORIGIN:?defina no .env}
      Cors__AllowedOrigins__1: "app://."
      Fiscal__Provider: simulated
      Fiscal__Environment: ${FISCAL_ENVIRONMENT:-homologation}
    ports:
      - "127.0.0.1:5160:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  solucao_pgdata:
