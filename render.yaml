# ============================================================================
# Render Blueprint — backend SOLUÇÃO 2026
# Conecte o repositório em https://dashboard.render.com → New → Blueprint
# e o Render cria o serviço a partir deste arquivo.
# ============================================================================
services:
  - type: web
    name: solucao-backend
    runtime: docker
    rootDir: solucao-2026/backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      # Connection string DIRETA do Neon (não a "pooled"! o pooler em modo
      # transação quebra o contexto de tenant do RLS). Formato:
      # Host=<host>.neon.tech;Port=5432;Database=solucao;Username=solucao_app;Password=<senha>;SSL Mode=Require;Pooling=true;Maximum Pool Size=10
      - key: ConnectionStrings__AppDb
        sync: false          # preencher no painel do Render (é segredo)
      - key: Jwt__Key
        generateValue: true  # o Render gera um segredo aleatório forte
      # Origem do dashboard no Netlify, ex.: https://solucao2026.netlify.app
      - key: Cors__AllowedOrigins__0
        sync: false
      - key: Cors__AllowedOrigins__1
        value: "app://."
      - key: Fiscal__Provider
        value: simulated
      - key: Fiscal__Environment
        value: homologation
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Dashboard hospedado aqui no Render (ver serviço abaixo)
      - key: Cors__AllowedOrigins__2
        value: "https://solucao-dashboard.onrender.com"

  # ==========================================================================
  # Dashboard (React/Vite) — site estático no mesmo painel do backend.
  # Existe porque o free tier do Netlify pausa deploys ao esgotar créditos;
  # aqui o build de estático não consome cota de horas.
  # ==========================================================================
  - type: web
    name: solucao-dashboard
    runtime: static
    rootDir: solucao-2026/dashboard
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: "https://solucao-backend.onrender.com"
    routes:
      # SPA: qualquer rota do React Router cai no index.html
      - type: rewrite
        source: /*
        destination: /index.html
