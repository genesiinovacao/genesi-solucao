<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Financeiro — SOLUÇÃO</title>
<link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/sidebar.css"><link rel="stylesheet" href="css/components.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-content" id="main-content">
    <header class="top-bar">
      <div class="top-bar-left">
        <button class="toggle-sidebar" id="toggle-sidebar">☰</button>
        <div><div class="page-title">💰 Financeiro</div><div class="page-subtitle" id="empresa-nome">SOLUÇÃO</div></div>
      </div>
      <div class="top-bar-right">
        <button class="notif-btn">🔔<span class="notif-badge" id="notif-badge">0</span></button>
        <div class="user-avatar">JS</div>
      </div>
    </header>
    <div class="page-wrapper">
      <div class="page-header">
        <h1><span class="h1-icon">💰</span>Financeiro</h1>
        <div class="page-actions">
          <button class="btn btn-success" onclick="novaTransacao('receita')">➕ Nova Receita</button>
          <button class="btn btn-danger" onclick="novaTransacao('despesa')">➖ Nova Despesa</button>
        </div>
      </div>

      <!-- Resumo Financeiro -->
      <div class="finance-summary" id="finance-summary"></div>

      <!-- Meu Lucro Card -->
      <div class="card" style="margin-bottom:18px;background:linear-gradient(135deg,rgba(124,58,237,.1),rgba(6,182,212,.05));border-color:rgba(124,58,237,.3)">
        <div class="card-header">
          <div><div class="card-title" style="font-size:1.1rem">📊 Meu Lucro — Análise do Mês</div><div class="card-subtitle">Receitas menos despesas do período</div></div>
          <span class="badge badge-primary">Maio 2026</span>
        </div>
        <div id="lucro-content" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px"></div>
      </div>

      <!-- Charts + Transações -->
      <div class="grid-2" style="margin-bottom:18px">
        <div class="card">
          <div class="card-header"><div class="card-title">📈 Fluxo de Caixa (7 dias)</div></div>
          <div class="chart-container"><canvas id="chart-fluxo"></canvas></div>
        </div>
        <div class="card">
          <div class="card-header"><div class="card-title">🍩 Despesas por Categoria</div></div>
          <div class="chart-container"><canvas id="chart-despesas"></canvas></div>
        </div>
      </div>

      <!-- Transações -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">📋 Lançamentos</div>
          <div style="display:flex;gap:8px">
            <select class="form-control" id="filtro-tipo-trans" style="width:130px">
              <option value="">Todos</option><option value="receita">Receitas</option><option value="despesa">Despesas</option>
            </select>
            <select class="form-control" id="filtro-status-trans" style="width:130px">
              <option value="">Todos</option><option value="pago">Pagos</option><option value="pendente">Pendentes</option>
            </select>
          </div>
        </div>
        <div class="table-wrapper">
          <table class="data-table">
            <thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Tipo</th><th>Valor</th><th>Status</th><th>Ações</th></tr></thead>
            <tbody id="trans-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal Transação -->
<div class="modal-overlay" id="modal-trans">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-trans-title">➕ Nova Receita</span>
      <button class="modal-close" onclick="APP.closeModal('modal-trans')">✕</button>
    </div>
    <div class="form-group"><label class="form-label">Descrição *</label><input type="text" class="form-control" id="t-desc" placeholder="Ex: Vendas do dia"></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Valor (R$) *</label><input type="number" class="form-control" id="t-valor" placeholder="0,00" step="0.01" min="0"></div>
      <div class="form-group"><label class="form-label">Data *</label><input type="date" class="form-control" id="t-data"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Categoria</label>
        <select class="form-control" id="t-categoria">
          <option>Vendas</option><option>Delivery</option><option>Compras</option><option>Aluguel</option><option>Utilidades</option><option>Salários</option><option>Outros</option>
        </select>
      </div>
      <div class="form-group"><label class="form-label">Status</label>
        <select class="form-control" id="t-status"><option value="pago">✅ Pago/Recebido</option><option value="pendente">⏳ Pendente</option></select>
      </div>
    </div>
    <input type="hidden" id="t-tipo">
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="APP.closeModal('modal-trans')">Cancelar</button>
      <button class="btn btn-primary" onclick="salvarTransacao()">💾 Salvar</button>
    </div>
  </div>
</div>

<script src="js/data.js"></script><script src="js/app.js"></script><script src="js/financeiro.js"></script>
</body>
</html>
